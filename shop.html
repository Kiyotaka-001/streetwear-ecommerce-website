<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Streetwearz — Shop All</title>
        <link rel="stylesheet" href="assets/css/styles.css"/>
    </head>
    <body>
        <header class="site-header">
            <nav class="nav-left" aria-label="Primary navigation">
                <a href="shop.html">Shop All</a>
                <a href="men.html">Men</a>
                <a href="women.html">Women</a>
                <a href="about.html">Story</a>
                <a href="contact.html">Contact</a>
            </nav>
            <a href="index.html" class="brand" aria-label="Streetwearz home">Streetwearz</a>
            <div class="nav-right">
                <button class="mobile-toggle" data-mobile-toggle>Menu</button>
                <a href="lookbook.html">Lookbook</a>
                <a href="cart.html" class="cart-link">Bag <span class="cart-count" data-cart-count>0</span></a>
            </div>
        </header>
        <main>
            <section class="page-hero section-pad">
                <div class="eyebrow reveal">Shop All</div>
                <h1 class="page-title reveal">Every piece from the latest Streetwearz drop.</h1>
            </section>
            <section class="section-pad">
                <div class="toolbar reveal">
                    <div class="filters">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="tees">Tees</button>
                        <button class="filter-btn" data-filter="hoodies">Hoodies</button>
                        <button class="filter-btn" data-filter="pants">Pants</button>
                        <button class="filter-btn" data-filter="jackets">Jackets</button>
                        <button class="filter-btn" data-filter="denim">Denim</button>
                        <button class="filter-btn" data-filter="skirts">Skirts</button>
                    </div>
                    <select class="sort-select" data-sort>
                        <option value="featured">Sort: Featured</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                    </select>
                </div>
                <div class="product-grid" data-products data-category="all"></div>
            </section>
        </main>
        <footer class="site-footer">
            <div>
                <h2>Streetwearz</h2>
                <p class="form-note">Street uniforms for everyday movement.</p>
            </div>
            <div class="footer-col">
                <strong>Shop</strong>
                <a href="shop.html">Shop All</a>
                <a href="men.html">Men</a>
                <a href="women.html">Women</a>
                <a href="lookbook.html">Lookbook</a>
            </div>
            <div class="footer-col">
                <strong>Support</strong>
                <a href="contact.html">Contact</a>
                <a href="cart.html">Cart</a>
                <a href="checkout.html">Checkout</a>
                <p>© 2026 Streetwearz. All rights reserved.</p>
            </div>
        </footer>
        <script src="assets/js/app.js"></script>
    </body>
</html>
